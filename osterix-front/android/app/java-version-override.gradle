// Java Version Override for OstErix
// This file enforces Java 16 compatibility across all tasks
// Capacitor 7.4.3 requires Java 16+ for pattern matching and switch expressions

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_16
        targetCompatibility JavaVersion.VERSION_16
    }
}

// Force Java 16 for all compilation tasks
tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = JavaVersion.VERSION_16.toString()
    targetCompatibility = JavaVersion.VERSION_16.toString()
}
