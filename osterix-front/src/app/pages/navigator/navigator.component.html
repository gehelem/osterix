<div class="navigator-container" *ngIf="isModuleLoaded; else noModule">
  <!-- Cards Grid -->
  <div class="cards-grid">
    <!-- Card 1: Image -->
    <mat-card>
      <mat-card-content>
        <div class="navigator-image-container">
          <img *ngIf="imageUrl" [src]="imageUrl" alt="Image du navigateur" class="navigator-image" (click)="openImageFullscreen()">

          <!-- Buttons overlay on image -->
          <div *ngIf="imageUrl" class="image-overlay-buttons">
            <button mat-mini-fab color="primary" (click)="showHistogram($event)" matTooltip="Histogramme">
              <mat-icon>bar_chart</mat-icon>
            </button>
            <button mat-mini-fab color="primary" (click)="showStatistics($event)" matTooltip="Statistiques">
              <mat-icon>analytics</mat-icon>
            </button>
          </div>

          <div *ngIf="!imageUrl" class="image-placeholder">
            <p>Aucune image disponible</p>
            <p class="hint">L'image apparaîtra ici après une recherche/centrage</p>
          </div>
        </div>
      </mat-card-content>
    </mat-card>

    <!-- Card 2: Actions & Status -->
    <mat-card>
      <mat-card-content>
        <div class="actions-container">
          <div class="status-section">
            <div class="status-header">
              <p><strong>Statut:</strong> {{ currentStatus }}</p>
            </div>

            <div class="search-section">
              <mat-form-field appearance="fill" class="search-field">
                <mat-label>Objet</mat-label>
                <input matInput [(ngModel)]="searchName" (input)="onSearchNameChange()" (keyup.enter)="performSearch()" placeholder="ex: M13, NGC281...">
              </mat-form-field>
              <button mat-raised-button color="primary" (click)="performSearch()" class="search-button">
                <mat-icon>search</mat-icon>
                Chercher
              </button>
            </div>
          </div>

          <div class="target-section">
            <h4>Cible</h4>
            <div class="target-inputs">
              <mat-form-field appearance="fill" class="target-field">
                <mat-label>Nom</mat-label>
                <input matInput [(ngModel)]="targetName" (input)="onTargetChange()">
              </mat-form-field>

              <mat-form-field appearance="fill" class="target-field">
                <mat-label>AD</mat-label>
                <input matInput type="number" [(ngModel)]="targetRA" (input)="onTargetChange()" step="0.01">
              </mat-form-field>

              <mat-form-field appearance="fill" class="target-field">
                <mat-label>DEC</mat-label>
                <input matInput type="number" [(ngModel)]="targetDEC" (input)="onTargetChange()" step="0.01">
              </mat-form-field>
            </div>
          </div>

          <div class="action-buttons">
            <button mat-raised-button color="primary" (click)="centerTarget()" [disabled]="!targetName">
              <mat-icon>gps_fixed</mat-icon>
              Centrer
            </button>
            <button mat-raised-button color="warn" (click)="abortNavigation()" [disabled]="!isRunning">
              <mat-icon>stop</mat-icon>
              Arrêter
            </button>
            <button mat-raised-button (click)="showSkyChart()">
              <mat-icon>map</mat-icon>
              Carte du ciel
            </button>
            <button mat-raised-button (click)="showCatalog()">
              <mat-icon>library_books</mat-icon>
              Catalogue
            </button>
            <button mat-raised-button (click)="showParameters()">
              <mat-icon>tune</mat-icon>
              Paramètres
            </button>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>

<!-- Fullscreen image overlay -->
<div *ngIf="fullscreenImageUrl" class="fullscreen-overlay" (click)="closeFullscreen()">
  <img [src]="fullscreenImageUrl" alt="Image du navigateur en plein écran" class="fullscreen-image">
</div>

<!-- No Module Loaded -->
<ng-template #noModule>
  <div class="no-module">
    <mat-card>
      <mat-card-content>
        <mat-icon class="warning-icon">warning</mat-icon>
        <p>Le module Navigator n'est pas chargé.</p>
        <p>Veuillez vérifier que le serveur OST est connecté et que le module est disponible.</p>
      </mat-card-content>
    </mat-card>
  </div>
</ng-template>
