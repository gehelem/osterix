<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OstErix</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1976d2">
  <meta name="description" content="Headless Observatory Control System">

  <!-- Capacitor specific meta tags for security -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https: wss: 'unsafe-inline' 'unsafe-eval'; media-src 'self' data:; img-src 'self' data: content: blob: https:;">

  <!-- Prevent zoom on iOS double-tap -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="OstErix">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="favicon.ico">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <app-root></app-root>

  <!-- Capacitor will inject native code here on app startup -->
  <script src="capacitor://bridge"></script>
</body>
</html>
