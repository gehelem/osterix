<div class="guider-container">
  <!-- Image section -->
  <div class="image-section">
    <mat-card>
      <mat-card-header>
        <mat-card-title>Image de guidage</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div class="image-container">
          <img *ngIf="imageUrl" [src]="imageUrl" alt="Guider image" class="guider-image">
          <div *ngIf="!imageUrl" class="no-image">Aucune image disponible</div>

          <!-- Image action buttons (only shown when image exists) -->
          <div *ngIf="imageUrl" class="image-actions">
            <button mat-mini-fab color="primary"
                    (click)="showHistogram($event)"
                    matTooltip="Histogramme">
              <mat-icon>bar_chart</mat-icon>
            </button>
            <button mat-mini-fab color="primary"
                    (click)="showStatistics($event)"
                    matTooltip="Statistiques">
              <mat-icon>info</mat-icon>
            </button>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <!-- Actions and Controls section -->
  <div class="controls-section">
    <!-- Actions card -->
    <mat-card>
      <mat-card-header>
        <mat-card-title>Actions</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div class="actions-grid">
          <!-- Calibrate button -->
          <button mat-raised-button
                  color="primary"
                  (click)="onCalibrate()"
                  [disabled]="!calibrateEnabled"
                  class="action-button">
            <mat-icon>settings_backup_restore</mat-icon>
            Calibrer
          </button>

          <!-- Guide button -->
          <button mat-raised-button
                  color="accent"
                  (click)="onGuide()"
                  [disabled]="!guideEnabled"
                  class="action-button">
            <mat-icon>explore</mat-icon>
            Guider
          </button>

          <!-- Abort Guider button -->
          <button mat-raised-button
                  color="warn"
                  (click)="onAbortGuider()"
                  [disabled]="!abortGuiderEnabled"
                  class="action-button">
            <mat-icon>stop</mat-icon>
            Arrêter le guidage
          </button>

          <!-- Clear calibration button -->
          <button mat-raised-button
                  color="warn"
                  (click)="onClearCalibration()"
                  [disabled]="!clearCalibrationEnabled"
                  class="action-button">
            <mat-icon>clear</mat-icon>
            Effacer calibration
          </button>

          <!-- Parameters button -->
          <button mat-raised-button
                  (click)="openParametersDialog()"
                  class="action-button">
            <mat-icon>settings</mat-icon>
            Paramètres
          </button>
        </div>
      </mat-card-content>
    </mat-card>

    <!-- Guiding Graph -->
    <mat-card class="graphs-card" *ngIf="guidingData && guidingData.grid && guidingData.grid.length > 0">
      <mat-card-content>
        <app-guiding-graph [guidingData]="guidingData"></app-guiding-graph>
      </mat-card-content>
    </mat-card>

    <!-- Empty state when no guiding data -->
    <mat-card class="graphs-card" *ngIf="!guidingData || !guidingData.grid || guidingData.grid.length === 0">
      <mat-card-content>
        <div class="graphs-placeholder">
          <p>En attente de données de guidage...</p>
          <p>Lancez une session de guidage pour afficher le graphique</p>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
