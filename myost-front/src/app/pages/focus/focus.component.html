<div class="focus-container">
  <div *ngIf="!isModuleLoaded" class="loading-message">
    <p>Chargement du module Focus...</p>
  </div>

  <div class="focus-main-container" *ngIf="isModuleLoaded">
    <div class="main-content">
        <div class="cards-grid">
          <!-- Card 1: Image de focus -->
          <mat-card>
            <mat-card-content>
              <div class="focus-image-container">
                <img *ngIf="imageUrl" [src]="imageUrl" alt="Image de focus" class="focus-image" (click)="openImageFullscreen()">

                <!-- Buttons overlay on image -->
                <div *ngIf="imageUrl" class="image-overlay-buttons">
                  <button mat-mini-fab color="primary" (click)="showHistogram($event)" matTooltip="Histogramme">
                    <mat-icon>bar_chart</mat-icon>
                  </button>
                  <button mat-mini-fab color="accent" (click)="showStatistics($event)" matTooltip="Statistiques">
                    <mat-icon>analytics</mat-icon>
                  </button>
                </div>

                <div *ngIf="!imageUrl" class="chart-placeholder">
                  <p>Aucune image disponible</p>
                  <p class="hint">L'image apparaîtra ici après une session de focus</p>
                </div>
              </div>
            </mat-card-content>
          </mat-card>

          <!-- Card 2: Boutons d'action -->
          <mat-card>
            <mat-card-content>
              <div class="actions-container">
                <div class="status-info">
                  <p><strong>Statut:</strong> {{ currentStatus }}</p>
                  <mat-progress-bar mode="determinate" [value]="progressValue"></mat-progress-bar>
                </div>
                <div class="action-buttons">
                  <button mat-raised-button color="primary" (click)="startFocus()" [disabled]="!isModuleLoaded || isRunning">
                    <mat-icon>play_arrow</mat-icon>
                    Démarrer Focus
                  </button>
                  <button mat-raised-button color="warn" (click)="stopFocus()" [disabled]="!isModuleLoaded || !isRunning">
                    <mat-icon>stop</mat-icon>
                    Arrêter
                  </button>
                  <button mat-raised-button (click)="openParametersDialog()">
                    <mat-icon>settings</mat-icon>
                    Paramètres
                  </button>
                </div>
              </div>
            </mat-card-content>
          </mat-card>

          <!-- Card 3: Graphique de focus -->
          <mat-card>
            <mat-card-content>
              <div class="focus-chart-container">
                <canvas #focusChart></canvas>
              </div>
            </mat-card-content>
          </mat-card>

          <!-- Card 4: Vide pour l'instant -->
          <mat-card>
            <mat-card-content>
              <div class="empty-card">
                <!-- Contenu à venir -->
              </div>
            </mat-card-content>
          </mat-card>
        </div>
      </div>
  </div>

  <!-- Fullscreen image overlay -->
  <div *ngIf="fullscreenImageUrl" class="fullscreen-overlay" (click)="closeFullscreen()">
    <img [src]="fullscreenImageUrl" alt="Image de focus en plein écran" class="fullscreen-image">
  </div>
</div>
